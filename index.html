<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демократическая Республика Интернета</title>
    <link rel="icon" type="image/svg+xml" href="flag.svg">
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Ostrovsky';
            src: url('Ostrovsky-Bold_0.otf') format('opentype');
            font-weight: bold;
        }
        :root {
            --deep-blue: #1E1E50;
            --purple: #5b2c8e;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PT Serif', serif;
            background: var(--deep-blue);
            color: var(--white);
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            background: rgba(30, 30, 80, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 10;
        }
        .logo img { height: 45px; }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 700;
            font-family: 'Ostrovsky', sans-serif;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        nav a:hover { color: var(--purple); }
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, rgba(30,30,80,0.7) 0%, rgba(30,30,80,0.95) 100%), url('hero-bg.jpg') center/cover;
            position: relative;
        }
        .hero h1 {
            font-size: 4rem;
            font-family: 'Ostrovsky', sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.4rem;
            max-width: 600px;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            background: var(--purple);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none;
            margin: 0.5rem;
            transition: background 0.3s;
        }
        .btn:hover { background: #482172; }
        .btn-outline {
            background: transparent;
            border: 2px solid white;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }
        footer {
            text-align: center;
            padding: 2rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="flag.svg" alt="Флаг ДРИ"></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="citizenship.html">Гражданство</a>
            <a href="constitution.html">Конституция</a>
            <a href="news.html">Новости</a>
            <a href="elections.html">Выборы</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Добро пожаловать в ДРИ</h1>
        <p>Первое суверенное цифровое государство. Прими присягу, получи паспорт и стань частью великой сети.</p>
        <div>
            <a href="citizenship.html" class="btn">Стать гражданином</a>
            <a href="constitution.html" class="btn btn-outline">Конституция</a>
        </div>
    </section>
    <footer>© 2026 Демократическая Республика Интернета</footer>
</body>
</html>
