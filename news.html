<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости ДРИ</title>
    <link rel="icon" type="image/svg+xml" href="flag.svg">
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Ostrovsky';
            src: url('Ostrovsky-Bold_0.otf') format('opentype');
            font-weight: bold;
        }
        :root {
            --deep-blue: #1E1E50;
            --purple: #5b2c8e;
            --white: #ffffff;
            --light-bg: #f4f7fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PT Serif', serif; background: var(--light-bg); }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 3rem; background: var(--deep-blue); color: white;
            position: sticky; top: 0; z-index: 10;
        }
        .logo img { height: 45px; }
        nav a {
            color: white; text-decoration: none; margin-left: 2rem;
            font-weight: bold; font-family: 'Ostrovsky', sans-serif;
        }
        nav a:hover { color: var(--purple); }
        .container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 2rem;
        }
        h1 {
            font-family: 'Ostrovsky', sans-serif;
            color: var(--deep-blue);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .news-item {
            background: white;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        .news-date {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 0.5rem;
        }
        .news-title {
            font-family: 'Ostrovsky', sans-serif;
            color: var(--deep-blue);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }
        .news-text {
            color: #333;
            line-height: 1.6;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--deep-blue);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="flag.svg" alt="Флаг ДРИ"></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="citizenship.html">Гражданство</a>
            <a href="constitution.html">Конституция</a>
            <a href="news.html">Новости</a>
            <a href="elections.html">Выборы</a>
        </nav>
    </header>

    <div class="container">
        <h1>Новости Республики</h1>
        <div id="news-container">Загрузка новостей...</div>
    </div>

    <footer>© 2026 Демократическая Республика Интернета</footer>

    <script>
        async function loadNews() {
            const container = document.getElementById('news-container');
            try {
                const response = await fetch('news.json');
                if (!response.ok) throw new Error('Файл новостей не найден');
                const news = await response.json();
                container.innerHTML = '';
                if (!Array.isArray(news) || news.length === 0) {
                    container.innerHTML = '<p>Пока новостей нет.</p>';
                    return;
                }
                // Сортировка по дате (сначала новые)
                news.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                news.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.innerHTML = `
                        <div class="news-date">${item.date || ''}</div>
                        <div class="news-title">${item.title || ''}</div>
                        <div class="news-text">${item.text || ''}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = '<p>Не удалось загрузить новости.</p>';
            }
        }
        loadNews();
    </script>
</body>
</html>
